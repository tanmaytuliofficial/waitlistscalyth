<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SCALYTH — System Awakening</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        void: '#030303',
                        offwhite: '#F1F1F1',
                        muted: '#8A8A8A'
                    },
                    fontFamily: {
                        syncopate: ['Syncopate', 'sans-serif'],
                        space: ['Space Grotesk', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background-color: #030303;
            color: #F1F1F1;
            font-family: 'Space Grotesk', sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: fixed;
        }

        .font-syncopate {
            font-family: 'Syncopate', sans-serif;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        @keyframes screenShake {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-3px, 2px); }
            20% { transform: translate(4px, -2px); }
            30% { transform: translate(-2px, -3px); }
            40% { transform: translate(3px, 3px); }
            50% { transform: translate(-1px, -1px); }
            100% { transform: translate(0, 0); }
        }

        .shake {
            animation: screenShake 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        #flash-overlay {
            position: fixed;
            inset: 0;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.08s ease-out;
        }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 25%, rgba(3, 3, 3, 0.9) 90%);
            pointer-events: none;
            z-index: 5;
        }

        .ui-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .ui-overlay.visible {
            opacity: 1;
        }

        .scanline {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            opacity: 0;
            pointer-events: none;
            z-index: 8;
        }

        @keyframes scanMove {
            0% { transform: translateY(-50px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(105vh); opacity: 0; }
        }

        .scanning {
            animation: scanMove 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .replay-btn {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 12px 28px;
            border-radius: 9999px;
            font-size: 10px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            transition: all 0.3s ease;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .replay-btn:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.96);
        }
    </style>
</head>
<body class="bg-void text-offwhite relative w-full h-full select-none">

    <div id="flash-overlay"></div>
    <div class="vignette"></div>
    <div id="scanline" class="scanline"></div>

    <canvas id="canvas"></canvas>

    <!-- Final Scene UI Overlay -->
    <div id="ui-content" class="ui-overlay text-center px-6">
        <div class="space-y-3 sm:space-y-4 max-w-xl mx-auto">
            <h1 class="font-syncopate text-2xl xs:text-3xl sm:text-5xl md:text-6xl font-bold tracking-[0.2em] sm:tracking-[0.25em] text-offwhite drop-shadow-[0_0_25px_rgba(255,255,255,0.25)]">
                SCALYTH
            </h1>
            <div class="h-px w-20 sm:w-28 bg-gradient-to-r from-transparent via-white/40 to-transparent mx-auto my-2"></div>
            <p class="font-syncopate text-[10px] xs:text-xs sm:text-sm tracking-[0.35em] sm:tracking-[0.4em] text-muted uppercase font-medium">
                COMING SOON
            </p>
            <p class="font-space text-[10px] sm:text-xs tracking-[0.25em] sm:tracking-[0.3em] text-white/40 uppercase pt-4 sm:pt-6">
                AN AI ECOSYSTEM FOR BUSINESS.
            </p>
            <div class="pt-6 sm:pt-8">
                <button id="replayBtn" class="replay-btn text-white/80">
                    Replay Awakening
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const flashOverlay = document.getElementById('flash-overlay');
        const uiContent = document.getElementById('ui-content');
        const scanline = document.getElementById('scanline');
        const replayBtn = document.getElementById('replayBtn');

        let width, height, dpr;
        let particles = [];
        let targetPositions = [];
        let pointer = { x: -1000, y: -1000, radius: 100, active: false };
        let reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Cinematic Timeline State
        let state = 'void';
        let stateTimer = 0;
        let lastTime = performance.now();

        // Device adaptation
        const isMobile = window.innerWidth < 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const PARTICLE_COUNT = reducedMotion ? 300 : (isMobile ? 750 : 2200);

        // High-DPI Canvas Setup
        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            ctx.scale(dpr, dpr);
        }

        window.addEventListener('resize', () => {
            resize();
            if (state === 'void' || state === 'forming') {
                targetPositions = generateTextTargets();
                reassignTargets();
            }
        });
        resize();

        // Universal Pointer / Touch Handlers for Mobile & Desktop
        function handlePointerMove(clientX, clientY) {
            pointer.x = clientX;
            pointer.y = clientY;
            pointer.active = true;
        }

        window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
        window.addEventListener('mouseleave', () => { pointer.active = false; });

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        window.addEventListener('touchend', () => { pointer.active = false; }, { passive: true });

        // Generate precise letter target points via offscreen canvas
        function generateTextTargets() {
            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d');
            offCanvas.width = width;
            offCanvas.height = height;

            offCtx.fillStyle = '#ffffff';
            
            // Responsive font sizing ensuring SCALYTH never wraps or clips on narrow phones
            let fontSize;
            if (width < 400) {
                fontSize = Math.floor(width / 6.2);
            } else if (width < 768) {
                fontSize = Math.floor(width / 6.8);
            } else {
                fontSize = Math.min(Math.floor(width / 7.5), 110);
            }

            offCtx.font = `700 ${fontSize}px 'Syncopate', sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillText('SCALYTH', width / 2, height / 2);

            const imgData = offCtx.getImageData(0, 0, width, height);
            const pixels = imgData.data;
            const coords = [];

            // Sampling density optimized for mobile performance vs desktop clarity
            const step = isMobile ? 4 : 3;
            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const index = (y * width + x) * 4;
                    if (pixels[index + 3] > 120) {
                        coords.push({ x: x, y: y });
                    }
                }
            }
            return coords;
        }

        // Particle Class definition
        class Particle {
            constructor() {
                this.resetToVoid();
            }

            resetToVoid() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.35;
                this.vy = (Math.random() - 0.5) * 0.35;
                this.size = Math.random() * 1.3 + 0.6;
                this.alpha = Math.random() * 0.4 + 0.2;
                this.baseAlpha = this.alpha;
                this.angle = Math.random() * Math.PI * 2;
                this.vxExplosion = 0;
                this.vyExplosion = 0;
                this.friction = 0.93;
            }

            update(progress, phase) {
                if (phase === 'void') {
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x < 0) this.x = width;
                    if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height;
                    if (this.y > height) this.y = 0;

                    // Central energy pulse
                    const dx = width / 2 - this.x;
                    const dy = height / 2 - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 260) {
                        this.alpha = this.baseAlpha + (1 - dist / 260) * 0.35;
                    } else {
                        this.alpha = this.baseAlpha;
                    }

                } else if (phase === 'forming') {
                    const target = this.assignedTarget;
                    if (target) {
                        const dx = target.x - this.x;
                        const dy = target.y - this.y;
                        
                        const swirlX = Math.cos(this.angle) * (1 - progress) * 60;
                        const swirlY = Math.sin(this.angle) * (1 - progress) * 60;

                        this.x += (dx + swirlX - (this.x - target.x) * 0.08) * 0.09;
                        this.y += (dy + swirlY - (this.y - target.y) * 0.08) * 0.09;
                        this.angle += 0.04;
                    }
                    this.alpha = Math.min(1, this.baseAlpha + progress * 0.55);

                } else if (phase === 'hold') {
                    const target = this.assignedTarget;
                    if (target) {
                        this.x = target.x + (Math.random() - 0.5) * 1.0;
                        this.y = target.y + (Math.random() - 0.5) * 1.0;
                    }
                    this.alpha = 0.85 + Math.random() * 0.15;

                } else if (phase === 'detonation') {
                    this.x += this.vxExplosion;
                    this.y += this.vyExplosion;
                    this.vxExplosion *= this.friction;
                    this.vyExplosion *= this.friction;
                    this.alpha = Math.max(0.12, this.alpha - 0.006);

                } else if (phase === 'settling' || phase === 'ambient') {
                    this.x += this.vx * 0.7;
                    this.y += this.vy * 0.7;
                    this.alpha += (0.35 - this.alpha) * 0.05;

                    if (this.x < 0) this.x = width;
                    if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height;
                    if (this.y > height) this.y = 0;
                }

                // Interactive touch/pointer repulsion
                if (pointer.active && phase !== 'forming') {
                    const mdx = pointer.x - this.x;
                    const mdy = pointer.y - this.y;
                    const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
                    if (mdist < pointer.radius) {
                        const force = (1 - mdist / pointer.radius) * 2.5;
                        this.x -= mdx * force * 0.04;
                        this.y -= mdy * force * 0.04;
                    }
                }
            }

            draw() {
                ctx.fillStyle = `rgba(241, 241, 241, ${this.alpha})`;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        // Initialize and map particles
        function initParticles() {
            particles = [];
            targetPositions = generateTextTargets();

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const p = new Particle();
                p.assignedTarget = targetPositions.length > 0 ? targetPositions[i % targetPositions.length] : { x: width / 2, y: height / 2 };
                particles.push(p);
            }
        }

        function reassignTargets() {
            particles.forEach((p, i) => {
                p.assignedTarget = targetPositions.length > 0 ? targetPositions[i % targetPositions.length] : { x: width / 2, y: height / 2 };
            });
        }

        initParticles();

        // Hero Detonation Sequence
        function triggerDetonation() {
            flashOverlay.style.opacity = '1';
            setTimeout(() => {
                flashOverlay.style.opacity = '0';
            }, 100);

            document.body.classList.add('shake');
            setTimeout(() => {
                document.body.classList.remove('shake');
            }, 350);

            particles.forEach(p => {
                const cx = width / 2;
                const cy = height / 2;
                const angle = Math.atan2(p.y - cy, p.x - cx) + (Math.random() - 0.5) * 0.35;
                const speed = Math.random() * 16 + 5;
                p.vxExplosion = Math.cos(angle) * speed;
                p.vyExplosion = Math.sin(angle) * speed;
            });

            setTimeout(() => {
                uiContent.classList.add('visible');
            }, 750);
        }

        // Main cinematic animation loop (60 FPS optimized)
        function animate(currentTime) {
            const dt = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            stateTimer += dt;

            // Clear frame with motion trail blur
            ctx.fillStyle = 'rgba(3, 3, 3, 0.22)';
            ctx.fillRect(0, 0, width, height);

            let phaseProgress = 0;
            let currentPhase = state;

            // Cinematic Timeline (~8 seconds total)
            if (stateTimer < 1.8) {
                currentPhase = 'void';
            } else if (stateTimer >= 1.8 && stateTimer < 4.8) {
                currentPhase = 'forming';
                phaseProgress = (stateTimer - 1.8) / 3.0;
                if (stateTimer >= 3.6 && !window.scanTriggered) {
                    scanline.classList.add('scanning');
                    window.scanTriggered = true;
                }
            } else if (stateTimer >= 4.8 && stateTimer < 5.3) {
                currentPhase = 'hold';
            } else if (stateTimer >= 5.3 && stateTimer < 5.5) {
                if (state !== 'detonation') {
                    state = 'detonation';
                    triggerDetonation();
                }
                currentPhase = 'detonation';
            } else if (stateTimer >= 5.5 && stateTimer < 6.8) {
                currentPhase = 'settling';
            } else {
                currentPhase = 'ambient';
            }

            for (let i = 0; i < particles.length; i++) {
                particles[i].update(phaseProgress, currentPhase);
                particles[i].draw();
            }

            // Connecting constellation webs in ambient state (desktop only)
            if (currentPhase === 'ambient' && !isMobile) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.025)';
                ctx.lineWidth = 0.5;
                for (let i = 0; i < particles.length; i += 16) {
                    for (let j = i + 1; j < particles.length; j += 16) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 75) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        requestAnimationFrame((time) => {
            lastTime = time;
            animate(time);
        });

        // Replay button listener (supports both touch and click)
        const resetSequence = (e) => {
            if (e) e.preventDefault();
            stateTimer = 0;
            window.scanTriggered = false;
            scanline.classList.remove('scanning');
            uiContent.classList.remove('visible');
            state = 'void';
            targetPositions = generateTextTargets();
            initParticles();
        };

        replayBtn.addEventListener('click', resetSequence);
        replayBtn.addEventListener('touchend', resetSequence);
    </script>
</body>
</html>
